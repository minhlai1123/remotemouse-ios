name: RemoteMousePro
options:
  bundleIdPrefix: com.remotemouse
  deploymentTarget:
    iOS: "15.0"
schemes:
  RemoteMouseApp:
    build:
      targets:
        RemoteMouseCore: all
        RemoteMouseApp: all
targets:
  RemoteMouseCore:
    type: framework
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/RemoteMouseCore
    info:
      path: Sources/RemoteMouseCore/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.remotemouse.core
      INFOPLIST_FILE: Sources/RemoteMouseCore/Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO

  RemoteMouseApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    dependencies:
      - target: RemoteMouseCore
        embed: true
        codeSign: false
    sources:
      - path: Sources/RemoteMouseApp
    info:
      path: Sources/RemoteMouseApp/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.remotemouse.ios
      INFOPLIST_FILE: Sources/RemoteMouseApp/Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
