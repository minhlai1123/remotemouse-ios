name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application & IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (.app)
        run: |
          xcodebuild clean build \
            -project RemoteMousePro.xcodeproj \
            -scheme RemoteMouseApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RemoteMousePro.ipa Payload
          echo "Successfully created RemoteMousePro.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMousePro-IPA
          path: RemoteMousePro.ipa
          retention-days: 14
